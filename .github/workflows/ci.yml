name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cargo test -p vaultbreak-vault -p vaultbreak-registry -p vaultbreak-pool
      - run: bash scripts/build-contracts.sh
      - run: npm ci
      - run: echo "NEAR_SANDBOX_BIN_PATH=$(bash scripts/fetch-sandbox.sh)" >> $GITHUB_ENV
      - run: npm run test:sandbox
      - run: npm run test:server
      - run: node --import tsx scripts/redteam-demo.ts --mock
      - run: node --import tsx scripts/privacy-demo.ts
      - run: node --import tsx scripts/nft-demo.ts --mock
      - run: node --import tsx scripts/swarm-demo.ts --mock
